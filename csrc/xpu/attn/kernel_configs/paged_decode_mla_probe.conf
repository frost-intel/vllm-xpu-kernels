# Minimal config for MLA decode profiling probes (NOT for shipping).
#
# Only the tuples vLLM's XPU MLA backend can actually request: head_size 576
# (kv_lora_rank 512 + qk_rope 64), page sizes 64 and 128, non-causal single
# token decode. Keeps the build small enough to iterate on kernel properties.
#
# Format: qgroup,headsize,pagesize,causal,local,sink

8,576,64,false,false,false
16,576,64,false,false,false
8,576,128,false,false,false
16,576,128,false,false,false
